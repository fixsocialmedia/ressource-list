{% assign lang = page.lang | default: site.lang | default: "en" %}
{% assign t = site.data.translations[lang] %}

<div class="language-selector">
  <button class="lang-toggle" aria-label="Select language" id="lang-toggle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="current-lang">{{ lang | upcase }}</span>
  </button>
  <div class="lang-dropdown" id="lang-dropdown">
    <a href="{{ page.url | remove: '/fr' | remove: '/es' | relative_url }}" class="lang-option {% if lang == 'en' %}active{% endif %}" data-lang="en">
      English
    </a>
    <a href="{{ '/fr' | append: page.url | relative_url }}" class="lang-option {% if lang == 'fr' %}active{% endif %}" data-lang="fr">
      Français
    </a>
    <a href="{{ '/es' | append: page.url | relative_url }}" class="lang-option {% if lang == 'es' %}active{% endif %}" data-lang="es">
      Español
    </a>
  </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function() {
  const langToggle = document.getElementById('lang-toggle');
  const langDropdown = document.getElementById('lang-dropdown');
  
  if (langToggle && langDropdown) {
    langToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      langDropdown.classList.toggle('show');
    });
    
    document.addEventListener('click', function() {
      langDropdown.classList.remove('show');
    });
    
    langDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }
});
</script>
