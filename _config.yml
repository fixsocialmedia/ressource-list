# Site settings
title: "Fix Social Media"
description: "A curated collection of tools and resources to improve social media quality and combat AI-generated content"
baseurl: "/ressource-list"
url: "https://fixsocialmedia.github.io"
lang: en

# Build settings
markdown: kramdown
theme: null

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - node_modules
  - vendor

# Navigation
navigation:
  - title: Home
    key: home
    url: /
  - title: Resources
    key: resources
    url: /resources
  - title: Ad Blocking
    key: ad_blocking
    url: /ad-blocking
  - title: Digital Well-being
    key: digital_wellbeing
    url: /digital-wellbeing
  - title: Framework
    key: framework
    url: /framework
  - title: Contributing
    key: contributing
    url: /contributing
  - title: About
    key: about
    url: /about

# Additional settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
